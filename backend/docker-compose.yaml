version: '3.8'

services:
  # --- Authentication Service (Port 8000) ---
  auth-service:
    build: ./auth-service
    container_name: auth_ent
    ports:
      - "8000:8000"
    networks:
      - ent_network
    restart: always

  # --- Document Service (Port 8001) ---
  doc-service:
    build: ./service-add-docs
    container_name: doc_service_ent
    ports:
      - "8001:8001"
    environment:
      - CASSANDRA_HOST=cassandra
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - cassandra
      - minio
      - auth-service
    networks:
      - ent_network
    restart: always

  # --- Cassandra Database ---
  cassandra:
    image: cassandra:latest
    container_name: cassandra_ent
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=ENT_CLUSTER
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - ent_network

  # --- MinIO Object Storage ---
  minio:
    image: minio/minio
    container_name: minio_ent
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - ent_network

networks:
  ent_network:
    driver: bridge

volumes:
  cassandra_data:
  minio_data: